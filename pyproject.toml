[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-agency"
version = "0.1.0"
description = "Minimal reference implementation for the Persistent Agency three-loop cognitive architecture."
requires-python = ">=3.11"
authors = [{name = "Nicholas St. John"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
