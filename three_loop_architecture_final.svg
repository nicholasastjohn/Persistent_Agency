<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
  <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.6 L5.6,3 L0.5,5.4 Z" fill="#208A55" stroke="#208A55" stroke-width="0.55" stroke-linejoin="round"/></marker>
  <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.6 L5.6,3 L0.5,5.4 Z" fill="#B94444" stroke="#B94444" stroke-width="0.55" stroke-linejoin="round"/></marker>
  <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.6 L5.6,3 L0.5,5.4 Z" fill="#3569B8" stroke="#3569B8" stroke-width="0.55" stroke-linejoin="round"/></marker>
  <marker id="arrowGray" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.6 L5.6,3 L0.5,5.4 Z" fill="#4A5568" stroke="#4A5568" stroke-width="0.55" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
  <style>
    .title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#172033}
    .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#4A5568}
    .paneltitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#24324A}
    .boxtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#172033}
    .boxtext{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;fill:#39465A}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:11.5px;fill:#536176}
    .looplabel{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700}
    .flowlabel{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;font-weight:700;fill:#334155}
  </style>
</defs>
<rect x="0" y="0" width="1800" height="1120" fill="#FFFFFF"/>
<text x="900" y="52" text-anchor="middle" class="title">Persistent Agency: Three-Loop Cognitive Architecture</text>
<text x="900" y="80" text-anchor="middle" class="subtitle">Heterogeneous specialization | continuous endogenous cognition | plastic pathways across multiple timescales</text>

<!-- Controller -->
<rect x="570" y="105" rx="14" ry="14" width="660" height="95" fill="#FFF6DE" stroke="#B77A13" stroke-width="2.2" filter="url(#shadow)"/>
<text x="900" y="137" text-anchor="middle" class="boxtitle">Controller</text>
<text x="900" y="160" text-anchor="middle" class="boxtext">Low-complexity motivational pressures and resource priorities</text>
<text x="900" y="181" text-anchor="middle" class="small">Operational integrity | goal pressure | attention | safety constraints | bounded human-responsiveness signal</text>

<!-- Main panels -->
<rect x="55" y="235" rx="18" width="520" height="660" fill="#F7FBFD" stroke="#8EA9B8" stroke-width="2"/>
<text x="315" y="268" text-anchor="middle" class="paneltitle">Memory, Association, and Automaticity</text>

<rect x="640" y="235" rx="18" width="520" height="660" fill="#FCF9F8" stroke="#A69A95" stroke-width="2"/>
<text x="900" y="268" text-anchor="middle" class="paneltitle">Continuous Cognitive Core</text>

<rect x="1225" y="235" rx="18" width="520" height="660" fill="#FAFCF5" stroke="#A6B27B" stroke-width="2"/>
<text x="1485" y="268" text-anchor="middle" class="paneltitle">Specialist Model Fabric / Agent Harness</text>

<!-- Left boxes -->
<rect x="95" y="300" rx="10" width="440" height="76" fill="#DFF3FA" stroke="#4D8DA3" stroke-width="1.8"/>
<text x="315" y="327" text-anchor="middle" class="boxtitle">Associator</text>
<text x="315" y="349" text-anchor="middle" class="boxtext">Links observations, goals, memories, causality, novelty, and prior usefulness</text>

<rect x="95" y="405" rx="9" width="132" height="73" fill="#EAF7FA" stroke="#72A6B8"/>
<text x="161" y="431" text-anchor="middle" class="boxtitle">Short-Term</text><text x="161" y="450" text-anchor="middle" class="boxtitle">Memory</text><text x="161" y="468" text-anchor="middle" class="small">Recent working state</text>
<rect x="249" y="405" rx="9" width="132" height="73" fill="#EAF7FA" stroke="#72A6B8"/>
<text x="315" y="431" text-anchor="middle" class="boxtitle">Persistent</text><text x="315" y="450" text-anchor="middle" class="boxtitle">Memory</text><text x="315" y="468" text-anchor="middle" class="small">Durable close state</text>
<rect x="403" y="405" rx="9" width="132" height="73" fill="#EAF7FA" stroke="#72A6B8"/>
<text x="469" y="431" text-anchor="middle" class="boxtitle">Long-Term</text><text x="469" y="450" text-anchor="middle" class="boxtitle">Memory</text><text x="469" y="468" text-anchor="middle" class="small">Consolidated knowledge</text>

<rect x="95" y="510" rx="9" width="205" height="78" fill="#F0EAF8" stroke="#8D6CB0"/>
<text x="197" y="539" text-anchor="middle" class="boxtitle">Fragmented Memory</text><text x="197" y="561" text-anchor="middle" class="boxtext">Lossy, compressed, costly retrieval</text>
<rect x="330" y="510" rx="9" width="205" height="78" fill="#E7F6E9" stroke="#5D9A69"/>
<text x="432" y="539" text-anchor="middle" class="boxtitle">Procedural Memory</text><text x="432" y="561" text-anchor="middle" class="boxtext">Compiled skills and automaticity</text>

<rect x="95" y="620" rx="9" width="440" height="72" fill="#EDF1F5" stroke="#7C8A99"/>
<text x="315" y="648" text-anchor="middle" class="boxtitle">Representation Adapter</text>
<text x="315" y="670" text-anchor="middle" class="boxtext">Vectors | graphs | symbolic relations | natural language | task-specific forms</text>

<rect x="95" y="735" rx="10" width="440" height="105" fill="#EEF4FF" stroke="#668BC7" stroke-width="1.8"/>
<text x="315" y="765" text-anchor="middle" class="boxtitle">Consolidation Engine</text>
<text x="315" y="788" text-anchor="middle" class="boxtext">Replay | compress | prune | merge | contradiction checks</text>
<text x="315" y="809" text-anchor="middle" class="boxtext">skill compilation | association updates | pathway reorganization</text>

<!-- Center boxes -->
<rect x="700" y="305" rx="12" width="400" height="145" fill="#FCE8E5" stroke="#BA665B" stroke-width="2" filter="url(#shadow)"/>
<text x="900" y="337" text-anchor="middle" class="boxtitle">Thinker</text>
<text x="900" y="360" text-anchor="middle" class="boxtext">Recurrent cognitive-state machine / functional workspace</text>
<text x="900" y="382" text-anchor="middle" class="boxtext">Foreground thought | goals | uncertainty | plans |</text>
<text x="900" y="401" text-anchor="middle" class="boxtext">attention | action candidates</text>
<text x="900" y="421" text-anchor="middle" class="small">Previous cognitive state can generate the next state without external input</text>
<text x="900" y="441" text-anchor="middle" class="small">Not identical to a frontier language model</text>

<rect x="700" y="510" rx="12" width="400" height="126" fill="#FFF1DF" stroke="#C68A3F" stroke-width="2"/>
<text x="900" y="541" text-anchor="middle" class="boxtitle">Prompter / Router</text>
<text x="900" y="565" text-anchor="middle" class="boxtext">Translates cognitive needs into specialist work</text>
<text x="900" y="587" text-anchor="middle" class="boxtext">Retrieves context | chooses mechanism | constructs requests</text>
<text x="900" y="609" text-anchor="middle" class="small">Returns structured outputs to the Thinker</text>

<rect x="700" y="708" rx="12" width="400" height="133" fill="#E9F7F5" stroke="#579B91" stroke-width="2"/>
<text x="900" y="740" text-anchor="middle" class="boxtitle">Environment Interface</text>
<rect x="730" y="767" rx="8" width="150" height="50" fill="#DDF4F4" stroke="#62A0A0"/>
<text x="805" y="789" text-anchor="middle" class="boxtitle">Collectors</text><text x="805" y="807" text-anchor="middle" class="small">Continuous sensing</text>
<rect x="920" y="767" rx="8" width="150" height="50" fill="#F9E3E3" stroke="#BC6F6F"/>
<text x="995" y="789" text-anchor="middle" class="boxtitle">Mechinator</text><text x="995" y="807" text-anchor="middle" class="small">Actions and actuation</text>

<!-- Right boxes -->
<rect x="1275" y="305" rx="10" width="420" height="88" fill="#EAF7C8" stroke="#83A74E"/>
<text x="1485" y="333" text-anchor="middle" class="boxtitle">Frontier Reasoning Models</text>
<text x="1485" y="356" text-anchor="middle" class="boxtext">General reasoning, language, synthesis, planning</text>
<text x="1485" y="376" text-anchor="middle" class="small">Replaceable; not the architecture itself</text>

<rect x="1275" y="425" rx="10" width="420" height="78" fill="#F0F8D7" stroke="#9AAE60"/>
<text x="1485" y="454" text-anchor="middle" class="boxtitle">Vision and Multimodal Models</text>
<text x="1485" y="477" text-anchor="middle" class="boxtext">Perception, interpretation, cross-modal inference</text>

<rect x="1275" y="535" rx="10" width="420" height="78" fill="#F0F8D7" stroke="#9AAE60"/>
<text x="1485" y="564" text-anchor="middle" class="boxtitle">Symbolic and Deterministic Tools</text>
<text x="1485" y="587" text-anchor="middle" class="boxtext">Math, search, databases, compilers, controllers</text>

<rect x="1275" y="645" rx="10" width="420" height="78" fill="#F0F8D7" stroke="#9AAE60"/>
<text x="1485" y="674" text-anchor="middle" class="boxtitle">Small Learned Policies / Classifiers</text>
<text x="1485" y="697" text-anchor="middle" class="boxtext">Low-cost specialized inference and routing</text>

<rect x="1275" y="755" rx="10" width="420" height="78" fill="#F0F8D7" stroke="#9AAE60"/>
<text x="1485" y="784" text-anchor="middle" class="boxtitle">Tools, Code, and External Services</text>
<text x="1485" y="807" text-anchor="middle" class="boxtext">Files, networks, simulations, application interfaces</text>

<!-- External environment -->
<rect x="320" y="960" rx="14" width="1160" height="88" fill="#EEF1F5" stroke="#6F7B89" stroke-width="2"/>
<text x="900" y="991" text-anchor="middle" class="boxtitle">External Environment</text>
<text x="900" y="1017" text-anchor="middle" class="boxtext">Humans and human feedback | physical world | digital systems | internet | sensors | tools | robots | events</text>

<!-- Information/control connections: thin, orthogonal, and routed only through whitespace -->
<!-- Controller influence enters the Thinker through the upper-right whitespace corridor. -->
<path d="M1060 200 L1120 200 L1120 285 L1040 285 L1040 305" fill="none" stroke="#4A5568" stroke-width="1.45" marker-end="url(#arrowGray)"/>

<!-- Associative context and representation traffic use separate center-left lanes. -->
<path d="M535 338 L650 338 L650 320 L700 320" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arrowGray)"/>
<path d="M700 430 L660 430 L660 656 L535 656" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arrowGray)"/>
<path d="M535 656 L675 656 L675 620 L700 620" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arrowGray)"/>

<!-- Specialist dispatch uses a dedicated bus. -->
<path d="M1100 548 L1182 548" fill="none" stroke="#4A5568" stroke-width="1.45"/>
<path d="M1182 349 L1182 794" fill="none" stroke="#4A5568" stroke-width="1.25"/>
<path d="M1182 349 L1275 349" fill="none" stroke="#4A5568" stroke-width="1.25" marker-end="url(#arrowGray)"/>
<path d="M1182 464 L1275 464" fill="none" stroke="#4A5568" stroke-width="1.25" marker-end="url(#arrowGray)"/>
<path d="M1182 574 L1275 574" fill="none" stroke="#4A5568" stroke-width="1.25" marker-end="url(#arrowGray)"/>
<path d="M1182 684 L1275 684" fill="none" stroke="#4A5568" stroke-width="1.25" marker-end="url(#arrowGray)"/>
<path d="M1182 794 L1275 794" fill="none" stroke="#4A5568" stroke-width="1.25" marker-end="url(#arrowGray)"/>

<!-- Structured specialist results return on their own lane rather than sharing the dispatch bus. -->
<path d="M1225 620 L1205 620 L1205 610 L1100 610" fill="none" stroke="#4A5568" stroke-width="1.45" marker-end="url(#arrowGray)"/>
<!-- Clear labels, placed in whitespace and not on top of connection lines. -->
<rect x="1107" y="516" width="68" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="1141" y="531" text-anchor="middle" class="flowlabel">DISPATCH</text>
<rect x="1124" y="625" width="66" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="1157" y="640" text-anchor="middle" class="flowlabel">RESULTS</text>

<!-- LOOP II: deliberative recurrence. Parallel Thinker/Prompter arrows remain separate. -->
<path d="M875 450 L875 510" fill="none" stroke="#B94444" stroke-width="2.0" marker-end="url(#arrowRed)"/>
<path d="M925 510 L925 450" fill="none" stroke="#B94444" stroke-width="2.0" marker-end="url(#arrowRed)"/>
<!-- Perception interrupts deliberation through a dedicated center-left lane. -->
<path d="M805 767 L805 682 L690 682 L690 585 L700 585" fill="none" stroke="#B94444" stroke-width="2.0" marker-end="url(#arrowRed)"/>
<!-- Deliberate action exits through the center-right lane. -->
<path d="M1100 585 L1145 585 L1145 792 L1070 792" fill="none" stroke="#B94444" stroke-width="2.0" marker-end="url(#arrowRed)"/>

<!-- LOOP I: reactive bypass. Green paths occupy their own corridors and do not share endpoints with gray/blue paths. -->
<path d="M690 960 L690 875 L760 875 L760 817" fill="none" stroke="#208A55" stroke-width="2.05" marker-end="url(#arrowGreen)"/>
<path d="M730 792 L595 792 L595 360 L535 360" fill="none" stroke="#208A55" stroke-width="2.05" marker-end="url(#arrowGreen)"/>
<path d="M535 545 L580 545 L580 920 L1035 920 L1035 817" fill="none" stroke="#208A55" stroke-width="2.05" marker-end="url(#arrowGreen)"/>
<path d="M995 817 L995 940 L1110 940 L1110 960" fill="none" stroke="#208A55" stroke-width="2.05" marker-end="url(#arrowGreen)"/>

<!-- LOOP III: consolidation uses two blue lanes, separated from the green and gray corridors. -->
<path d="M740 450 L740 470 L620 470 L620 760 L535 760" fill="none" stroke="#3569B8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
<path d="M535 810 L610 810 L610 285 L740 285 L740 305" fill="none" stroke="#3569B8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
<!-- Consolidation writes to colder and procedural memory through distinct box-edge entry points. -->
<path d="M95 770 L65 770 L65 565 L95 565" fill="none" stroke="#3569B8" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
<path d="M535 790 L558 790 L558 570 L535 570" fill="none" stroke="#3569B8" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>

<!-- Associator fans into the three high-availability memory tiers through a short local bus. -->
<path d="M315 376 L315 392" fill="none" stroke="#4A5568" stroke-width="1.3"/>
<path d="M161 392 L469 392" fill="none" stroke="#4A5568" stroke-width="1.3"/>
<path d="M161 392 L161 405" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arrowGray)"/>
<path d="M315 392 L315 405" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arrowGray)"/>
<path d="M469 392 L469 405" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arrowGray)"/>

<!-- Legend -->
<rect x="70" y="1070" width="1660" height="34" fill="#FFFFFF"/>
<line x1="90" y1="1087" x2="145" y2="1087" stroke="#208A55" stroke-width="2.25" marker-end="url(#arrowGreen)"/><text x="158" y="1092" class="small">Reactive</text>
<line x1="270" y1="1087" x2="325" y2="1087" stroke="#B94444" stroke-width="2.15" marker-end="url(#arrowRed)"/><text x="338" y="1092" class="small">Deliberative</text>
<line x1="485" y1="1087" x2="540" y2="1087" stroke="#3569B8" stroke-width="1.95" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/><text x="553" y="1092" class="small">Consolidation</text>
<line x1="710" y1="1087" x2="765" y2="1087" stroke="#4A5568" stroke-width="1.55" marker-end="url(#arrowGray)"/><text x="778" y="1092" class="small">Information / control</text>
<text x="1710" y="1092" text-anchor="end" class="small">Human questions enter through Collectors; human satisfaction is feedback, not direct resource reward.</text>
</svg>